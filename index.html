<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Familienplaner & Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ==========================================================================
         1. APP HEADER: PERSONEN-LEGENDE & SYNC-STATUS
         ========================================================================== -->
    <header class="app-header">
        <div class="legend-container">
            <span class="legend-item papa"><i class="icon">🐨</i> Papa</span>
            <span class="legend-item mama"><i class="icon">🐨</i> Mama</span>
            <span class="legend-item oskar"><i class="icon">🐦</i> Oskar</span>
            <span class="legend-item irma"><i class="icon">👧</i> Irma</span>
            <span class="legend-item eltern"><i class="icon">🏠</i> Eltern / Allgemein</span>
        </div>

        <div class="status-container">
            <div id="sync-status" class="sync-status">Sync in: <span id="sync-countdown">00:00</span></div>
            <div id="last-update" class="last-update">Stand: --:--:--</div>
            <button id="btn-open-settings" class="btn-icon" aria-label="Einstellungen">⚙️</button>
        </div>
    </header>

    <!-- ==========================================================================
         2. TELEMETRIE BAR: ENERGIEFLUSS & SHELLY STATUS
         ========================================================================== -->
    <section class="energy-shelly-bar">
        <div class="energy-flow-container">
            <div class="energy-node" id="node-pv">
                <span class="label">☀️ PV-Dach</span>
                <span class="value" id="val-pv">0.0 kW</span>
                <span class="arrow" id="arrow-pv">➔</span>
            </div>
            <div class="energy-node" id="node-battery">
                <span class="label">🐳 Speicher</span>
                <span class="value" id="val-battery">0.0 kW</span>
                <span class="arrow" id="arrow-battery">➔</span>
            </div>
            <div class="energy-node" id="node-house">
                <span class="label">🏠 Haus</span>
                <span class="value" id="val-house">0.0 kW</span>
            </div>
            <div class="energy-node" id="node-grid">
                <span class="label">⚡ Netz</span>
                <span class="value" id="val-grid">0.0 kW</span>
                <span class="arrow" id="arrow-grid">➔</span>
            </div>
            <div class="energy-node" id="node-zappi">
                <span class="label">🚗 Zappi Wallbox</span>
                <span class="value" id="val-zappi">0.0 kW</span>
            </div>
        </div>

        <div class="shelly-container" id="shelly-status-list">
            <div class="shelly-item" id="shelly-oskar-light">
                <span class="shelly-name">Licht Oskar:</span>
                <span class="shelly-state badge-off">AUS</span>
            </div>
        </div>
    </section>

    <!-- ==========================================================================
         3. HAUPTBEREICH: 3-SPALTEN-PLANER (HEUTE, MORGEN, ÜBERMORGEN)
         ========================================================================== -->
    <main class="planner-grid">
        <section class="day-column" id="col-heute">
            <h2 class="column-header">Heute <span class="date-sub" id="date-heute"></span></h2>
            <div class="active-timers-bar" id="timers-heute"></div>
            <div class="events-list" id="events-heute"></div>
        </section>

        <section class="day-column" id="col-morgen">
            <h2 class="column-header">Morgen <span class="date-sub" id="date-morgen"></span></h2>
            <div class="active-timers-bar" id="timers-morgen"></div>
            <div class="events-list" id="events-morgen"></div>
        </section>

        <section class="day-column" id="col-uebermorgen">
            <h2 class="column-header">Übermorgen <span class="date-sub" id="date-uebermorgen"></span></h2>
            <div class="active-timers-bar" id="timers-uebermorgen"></div>
            <div class="events-list" id="events-uebermorgen"></div>
        </section>
    </main>

    <!-- ==========================================================================
         4. POPUP: KINDGERECHTER AUFGABEN-TIMER (ANALOG + DIGITAL)
         ========================================================================== -->
